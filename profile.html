<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - Custom Zone</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="js/firebase-config.js"></script>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
</head>
<body>

    <header class="navbar">
        <div class="logo-container">
            <a href="index.html"><img src="assets/images/logo.png" alt="Custom Zone" class="logo-img"></a>
            <h1 class="brand-name">Custom Zone</h1>
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="profile.html" class="active">My Account</a>
            <a href="cart.html">Cart</a>
            <a href="javascript:void(0)" onclick="logoutCustomer()" style="color:#e74c3c;"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
        <div class="cart-icon">
            <a href="cart.html"><i class="fas fa-shopping-cart"></i><span class="cart-count">0</span></a>
        </div>
    </header>

    <main class="container">
        <div style="background:#fff; padding:20px; border-radius:10px; box-shadow:var(--shadow-soft); margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; border-left:5px solid var(--honey-dawn);">
            <div>
                <h2 style="color:var(--midnight-plum); margin:0;" id="user-display-name">Welcome!</h2>
                <p style="color:#7f8c8d; margin:4px 0 0 0; font-size:14px;"><i class="fas fa-phone-alt"></i> <span id="user-display-phone">-</span></p>
            </div>
            <button onclick="logoutCustomer()" style="background:#e74c3c; color:#fff; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:13px;">Logout</button>
        </div>

        <!-- Saved Wishlist Section -->
        <div style="background:#fff; padding:20px; border-radius:10px; box-shadow:var(--shadow-soft); margin-bottom:25px;">
            <h3 style="color:var(--midnight-plum); margin-bottom:15px; border-bottom:2px solid #eee; padding-bottom:8px;"><i class="fas fa-heart" style="color:#e74c3c;"></i> My Saved Wishlist (Synced across devices)</h3>
            <div class="product-grid" id="wishlist-container">
                <p style="text-align:center; color:#7f8c8d; grid-column:1/-1;">Loading your saved wishlist...</p>
            </div>
        </div>

        <!-- Orders History Section -->
        <div style="background:#fff; padding:20px; border-radius:10px; box-shadow:var(--shadow-soft);">
            <h3 style="color:var(--midnight-plum); margin-bottom:15px; border-bottom:2px solid #eee; padding-bottom:8px;"><i class="fas fa-shopping-bag"></i> My Previous Orders</h3>
            <div id="orders-history-container">
                <p style="text-align:center; color:#7f8c8d;">Fetching order history...</p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Custom Zone. All Rights Reserved.</p>
    </footer>

    <script>
        let currentCust = JSON.parse(localStorage.getItem('cz_customer_user'));
        if(!currentCust) {
            window.location.href = "index.html";
        } else {
            document.getElementById('user-display-name').innerText = currentCust.name || "Customer";
            document.getElementById('user-display-phone').innerText = currentCust.phone || "";
            loadFreshCloudProfile();
            loadCustomerOrders();
        }

        function logoutCustomer() {
            localStorage.removeItem('cz_customer_user');
            window.location.href = "index.html";
        }

        async function loadFreshCloudProfile() {
            try {
                const doc = await db.collection("customers").doc(currentCust.phone).get();
                if(doc.exists) {
                    currentCust = doc.data();
                    localStorage.setItem('cz_customer_user', JSON.stringify(currentCust));
                    renderWishlistDOM(currentCust.wishlist || []);
                }
            } catch(e) {
                renderWishlistDOM(currentCust.wishlist || []);
            }
        }

        function renderWishlistDOM(wishlist) {
            const container = document.getElementById('wishlist-container');
            if(wishlist.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#7f8c8d; grid-column:1/-1; padding:20px;'>Your wishlist is empty.</p>";
                return;
            }

            container.innerHTML = "";
            wishlist.forEach((prod, index) => {
                container.innerHTML += `
                    <div class="product-card">
                        <img src="${prod.image || 'assets/images/logo.png'}" alt="${prod.name}">
                        <h3>${prod.name}</h3>
                        <p>₹${prod.price}</p>
                        <div style="display:flex; gap:6px;">
                            <button class="btn-cart-action" onclick="moveWishlistToCart('${prod.id}', ${index})"><i class="fas fa-shopping-cart"></i> Move to Cart</button>
                            <button onclick="removeWishlistItemCloud(${index})" style="background:#e74c3c; color:white; border:none; padding:8px 12px; border-radius:6px; cursor:pointer;"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        async function removeWishlistItemCloud(idx) {
            let wishlist = currentCust.wishlist || [];
            wishlist.splice(idx, 1);
            currentCust.wishlist = wishlist;
            localStorage.setItem('cz_customer_user', JSON.stringify(currentCust));

            await db.collection("customers").doc(currentCust.phone).update({ wishlist: wishlist });
            renderWishlistDOM(wishlist);
        }

        function moveWishlistToCart(prodId, idx) {
            let wishlist = currentCust.wishlist || [];
            let item = wishlist[idx];
            let cart = JSON.parse(localStorage.getItem('cz_cart')) || [];
            cart.push(item);
            localStorage.setItem('cz_cart', JSON.stringify(cart));
            removeWishlistItemCloud(idx);
            alert("Moved to cart!");
        }

        async function loadCustomerOrders() {
            const container = document.getElementById('orders-history-container');
            let cleanPhone = currentCust.phone.replace(/[^0-9]/g, '');

            try {
                const snapshot = await db.collection("orders").get();
                let myOrders = [];

                snapshot.forEach(doc => {
                    let ord = doc.data();
                    ord.id = doc.id;
                    let ordPhone = (ord.phone || '').replace(/[^0-9]/g, '');
                    if(ordPhone.endsWith(cleanPhone) || cleanPhone.endsWith(ordPhone)) {
                        myOrders.push(ord);
                    }
                });

                if(myOrders.length === 0) {
                    container.innerHTML = "<p style='text-align:center; color:#7f8c8d; padding:20px;'>No past orders found for this phone number.</p>";
                    return;
                }

                let html = `<div style="display:flex; flex-direction:column; gap:12px;">`;
                myOrders.forEach(ord => {
                    let badgeBg = "#f39c12";
                    if(ord.status === "Delivered Successfully") badgeBg = "#27ae60";
                    if(ord.status.includes("Shipped")) badgeBg = "#2980b9";

                    html += `
                        <div style="border:1px solid #eee; padding:15px; border-radius:8px; background:#fafbfc;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                                <strong style="color:var(--midnight-plum); font-size:15px;">Order #${ord.id}</strong>
                                <span style="background:${badgeBg}; color:white; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:bold;">${ord.status}</span>
                            </div>
                            <p style="font-size:13px; color:#555; margin:4px 0;"><pre style="font-family:inherit; font-size:12px; white-space:pre-wrap;">${ord.items}</pre></p>
                            <div style="display:flex; justify-content:space-between; margin-top:8px; font-size:13px;">
                                <span>Date: <strong>${ord.date || 'N/A'}</strong></span>
                                <span style="font-weight:bold; color:#27ae60;">Total: ₹${ord.totalAmount}</span>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
                container.innerHTML = html;
            } catch(e) {
                container.innerHTML = "<p style='color:red;'>Failed to load orders.</p>";
            }
        }
    </script>
</body>
</html>
