<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Profile & Orders - Custom Zone</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="js/firebase-config.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        
        .profile-container { max-width: 800px; margin: 30px auto; padding: 0 15px; width: 100%; flex: 1; }
        .profile-card { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; margin-bottom: 25px; }
        
        .order-history-card { background: #fff; padding: 18px; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .order-head-row { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; margin-bottom: 10px; flex-wrap: wrap; gap: 6px; }
        
        .status-badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; display: inline-block; text-transform: uppercase; }
        .status-pending { background: #fef3c7; color: #b45309; border: 1px solid #fcd34d; }
        .status-processing { background: #e0e7ff; color: #3730a3; }
        .status-packed { background: #ede9fe; color: #5b21b6; }
        .status-shipped { background: #cffafe; color: #155e75; }
        .status-delivered { background: #d1fae5; color: #065f46; }
        .status-cancelled { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

    <!-- Professional Navbar -->
    <header class="navbar">
        <div class="nav-brand-section">
            <a href="index.html" class="logo-link">
                <img src="assets/images/logo.png" alt="Custom Zone Logo" class="logo-img">
                <div class="brand-text-container">
                    <span class="brand-title">Custom Zone</span>
                    <span class="brand-tagline">You Imagine. We Customize.</span>
                </div>
            </a>
        </div>
        <nav class="nav-menu-links">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
            <a href="track-order.html">Track Order</a>
        </nav>
        <div class="nav-actions">
            <a href="cart.html" class="cart-icon-btn">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-badge cart-count">0</span>
            </a>
        </div>
    </header>

    <div class="profile-container">
        <!-- Customer Details Box -->
        <div class="profile-card">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                <div style="display:flex; align-items:center; gap:14px;">
                    <div style="width:55px; height:55px; border-radius:50%; background:#e0e7ff; color:#28469E; display:flex; align-items:center; justify-content:center; font-size:24px;">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <div>
                        <h2 style="margin:0; color:#1e293b; font-size:18px;" id="profile-name">Customer Name</h2>
                        <p style="margin:2px 0 0 0; font-size:12.5px; color:#64748b;">
                            Phone: <strong id="profile-phone">-</strong> | ID: <strong id="profile-cust-id" style="color:#28469E;">-</strong>
                        </p>
                    </div>
                </div>
                <button onclick="logoutCustomer()" style="background:#fee2e2; color:#ef4444; border:1px solid #fca5a5; padding:8px 16px; border-radius:6px; font-weight:700; font-size:12px; cursor:pointer;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
            <div style="margin-top:14px; background:#f8fafc; padding:10px 14px; border-radius:6px; font-size:12px; color:#475569; border:1px solid #e2e8f0;">
                <i class="fas fa-map-marker-alt" style="color:#ef4444;"></i> <strong>Saved Address:</strong> <span id="profile-address">-</span>
            </div>
        </div>

        <!-- Orders & Verification History -->
        <h3 style="color:#1e293b; margin-bottom:14px; font-size:16px;">
            <i class="fas fa-box-open" style="color:#28469E;"></i> All My Orders & Payment Verification Status
        </h3>

        <div id="customer-orders-container">
            <p style="text-align:center; padding:20px; color:#64748b; font-size:13px;"><i class="fas fa-spinner fa-spin"></i> Fetching all your placed orders...</p>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 Custom Zone. All Rights Reserved. | <a href="contact.html">Contact Us</a></p>
    </footer>

    <script>
        let currentCustomer = JSON.parse(localStorage.getItem('cz_customer_user'));

        if (!currentCustomer) {
            alert("Please login first to view your profile and orders.");
            window.location.href = "index.html";
        }

        function updateCartCount() {
            let cart = JSON.parse(localStorage.getItem('cz_cart')) || [];
            document.querySelectorAll('.cart-count').forEach(el => el.innerText = cart.length);
        }

        function logoutCustomer() {
            localStorage.removeItem('cz_customer_user');
            window.location.href = "index.html";
        }

        // FETCH ALL ORDERS (MULTIPLE RECORDS SUPPORTED)
        async function fetchCustomerAllOrders() {
            const container = document.getElementById('customer-orders-container');
            let cleanPhone = currentCustomer.phone.replace(/[^0-9]/g, '');
            if (cleanPhone.length > 10) cleanPhone = cleanPhone.slice(-10);

            document.getElementById('profile-name').innerText = currentCustomer.name || "Customer";
            document.getElementById('profile-phone').innerText = currentCustomer.phone;
            document.getElementById('profile-cust-id').innerText = currentCustomer.customerId || "CZ-CUST";
            document.getElementById('profile-address').innerText = currentCustomer.savedAddress || "Not provided";

            try {
                // 1. Fetch from Pending Payments (Unverified/Awaiting Admin Verification)
                const pendingSnap = await db.collection("pending_payments")
                    .where("phone", "==", cleanPhone)
                    .get();

                // 2. Fetch from Confirmed Orders
                const confirmedSnap = await db.collection("orders")
                    .where("phone", "==", cleanPhone)
                    .get();

                let allOrders = [];

                pendingSnap.forEach(doc => {
                    let d = doc.data();
                    d.type = "pending";
                    d.displayId = d.paymentReference || doc.id;
                    allOrders.push(d);
                });

                confirmedSnap.forEach(doc => {
                    let d = doc.data();
                    d.type = "confirmed";
                    d.displayId = d.orderId || doc.id;
                    allOrders.push(d);
                });

                if (allOrders.length === 0) {
                    container.innerHTML = `
                        <div style="text-align:center; padding:35px 20px; background:#fff; border-radius:10px; border:1px solid #e2e8f0;">
                            <i class="fas fa-shopping-bag" style="font-size:40px; color:#94a3b8; margin-bottom:10px;"></i>
                            <h4 style="margin:0; color:#334155;">No orders placed yet!</h4>
                            <p style="font-size:12px; color:#64748b; margin-top:4px;">When you place an order, all your tracking records will appear here.</p>
                            <a href="index.html" style="background:#28469E; color:#fff; padding:8px 18px; border-radius:6px; text-decoration:none; font-size:12px; font-weight:700; display:inline-block; margin-top:10px;">Order Personalized Gifts</a>
                        </div>
                    `;
                    return;
                }

                // Sort: Newest orders first
                allOrders.sort((a, b) => {
                    let timeA = a.createdAt?.seconds || a.verifiedAt?.seconds || 0;
                    let timeB = b.createdAt?.seconds || b.verifiedAt?.seconds || 0;
                    return timeB - timeA;
                });

                container.innerHTML = "";

                allOrders.forEach(ord => {
                    let isPending = ord.type === "pending";
                    let status = isPending ? "Payment Verification Pending" : (ord.orderStatus || ord.status || "Processing");
                    
                    let badgeClass = "status-processing";
                    let sLow = status.toLowerCase();
                    if (isPending) badgeClass = "status-pending";
                    else if (sLow === "delivered") badgeClass = "status-delivered";
                    else if (sLow === "shipped") badgeClass = "status-shipped";
                    else if (sLow === "packed") badgeClass = "status-packed";
                    else if (sLow === "cancelled") badgeClass = "status-cancelled";

                    let itemsHTML = "";
                    if (Array.isArray(ord.items)) {
                        itemsHTML = ord.items.map(it => `
                            <div style="font-size:12px; color:#334155; margin-bottom:3px;">
                                • <strong>${it.name}</strong> ${it.variantName ? `<span style="color:#64748b;">(${it.variantName})</span>` : ''} x${it.quantity || 1} - <strong>₹${it.chargedAmount || it.price}</strong>
                            </div>
                        `).join('');
                    } else {
                        itemsHTML = `<div style="font-size:12px; color:#334155;">${ord.items || 'Custom Handcrafted Gift'}</div>`;
                    }

                    container.innerHTML += `
                        <div class="order-history-card">
                            <div class="order-head-row">
                                <div>
                                    <strong style="color:#0f172a; font-size:13.5px;">${isPending ? 'Payment Ref' : 'Order ID'}: #${ord.displayId}</strong>
                                    <div style="font-size:11px; color:#64748b; margin-top:2px;">Placed on: ${ord.date || 'Recent'}</div>
                                </div>
                                <div>
                                    <span class="status-badge ${badgeClass}">${status}</span>
                                </div>
                            </div>

                            <div style="background:#f8fafc; padding:10px; border-radius:6px; margin:8px 0; border:1px solid #f1f5f9;">
                                ${itemsHTML}
                            </div>

                            <div style="display:flex; justify-content:space-between; align-items:center; font-size:12.5px; border-top:1px dashed #e2e8f0; padding-top:8px;">
                                <span style="color:#64748b;">Total Paid / Payable:</span>
                                <strong style="color:#16a34a; font-size:14px;">₹${ord.totalAmount || ord.total || 0}</strong>
                            </div>

                            ${isPending ? `
                                <div style="background:#fffbeb; border:1px solid #fde68a; padding:8px 10px; border-radius:4px; font-size:11px; color:#92400e; margin-top:8px;">
                                    ℹ️ Our team is verifying your payment screenshot on WhatsApp. Your official <strong>Order ID</strong> will be generated right after verification.
                                </div>
                            ` : ''}
                        </div>
                    `;
                });

            } catch(e) {
                console.error("Error loading orders:", e);
                container.innerHTML = "<p style='color:red; text-align:center;'>Error loading order history.</p>";
            }
        }

        window.onload = () => {
            updateCartCount();
            fetchCustomerAllOrders();
        };
    </script>
</body>
</html>
