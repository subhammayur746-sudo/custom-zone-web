<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Zone - Home</title>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Firebase CDN Links -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <!-- Custom Firebase Config -->
    <script src="js/firebase-config.js"></script>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo-container">
            <a href="index.html">
                <img src="assets/images/logo.png" alt="Custom Zone Logo" class="logo-img">
            </a>
            <h1 class="brand-name">Custom Zone</h1>
        </div>
        
        <nav class="nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
            <a href="track-order.html">Track Order</a>
        </nav>

        <div class="cart-icon">
            <a href="cart.html">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-count">0</span>
            </a>
        </div>
    </header>

    <!-- Main Content: Product List -->
    <main class="container">
        <h2 class="section-title">Trending Products</h2>
        <!-- Products will load dynamically from main.js -->
        <div class="product-grid" id="product-list"></div>
    </main>

    <!-- Promo Pop-up Modal -->
    <div id="promo-popup" class="popup-overlay">
        <div class="popup-content">
            <span class="close-btn" onclick="closePopup()">&times;</span>
            <img id="promo-img-display" src="" alt="Promotion" style="display: none;">
            <h3 id="promo-title-text" style="color: #2c3e50; margin-bottom: 8px;"></h3>
            <p id="promo-desc-text" style="color: #7f8c8d; font-size: 14px; margin-bottom: 15px;"></p>
            <button class="add-to-cart-btn" onclick="closePopup()">Explore Now</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Custom Zone. All Rights Reserved.</p>
        <p>Located at Liluah Chakpara, Howrah | <a href="contact.html">Contact Us</a></p>
    </footer>

    <!-- Main JS -->
    <script src="js/main.js"></script>
</body>
</html>
