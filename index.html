<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Zone - Home</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="js/firebase-config.js"></script>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
</head>
<body>

    <header class="navbar">
        <div class="logo-container">
            <a href="index.html">
                <img src="assets/images/logo.png" alt="Custom Zone Logo" class="logo-img">
            </a>
            <h1 class="brand-name">Custom Zone</h1>
        </div>
        <nav class="nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
            <a href="track-order.html">Track Order</a>
            <span id="nav-user-slot">
                <a href="javascript:void(0)" onclick="openAuthModal()"><i class="fas fa-user"></i> Login</a>
            </span>
        </nav>
        <div class="cart-icon">
            <a href="cart.html">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-count">0</span>
            </a>
        </div>
    </header>

    <!-- Category Subnav -->
    <div class="category-subnav" id="dynamic-cat-nav">
        <button class="cat-dropdown-btn active">All</button>
    </div>

    <!-- Search & Prices Filter Bar -->
    <div class="filter-control-bar">
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="home-search-input" onkeyup="filterHomeProducts()" placeholder="Search gifts, keychains, frames...">
        </div>
        
        <select id="budget-filter" class="price-filter-select" onchange="filterHomeProducts()">
            <option value="all">🏷️ Prices: All</option>
            <option value="199">Under ₹199</option>
            <option value="299">Under ₹299</option>
            <option value="499">Under ₹499</option>
            <option value="500plus">₹500+ Luxury Items</option>
        </select>
    </div>

    <main class="container">
        <h2 class="section-title">Trending Products</h2>
        <div class="product-grid" id="product-list"></div>
    </main>

    <!-- Customer Phone Login/Signup Modal -->
    <div id="auth-modal">
        <div class="auth-card">
            <span class="close-btn" onclick="closeAuthModal()">&times;</span>
            <h3 style="color:#3B163A; margin-bottom:6px;"><i class="fas fa-user-circle"></i> Customer Login</h3>
            <p style="font-size:12px; color:#636e72; margin-bottom:15px;">Login with your phone number to access wishlist & order history!</p>
            
            <input type="text" id="auth-name" placeholder="Your Name *">
            <input type="tel" id="auth-phone" placeholder="10-digit WhatsApp Phone *">
            
            <button onclick="handleCustomerAuth()">Continue</button>
        </div>
    </div>

    <!-- Promo Popup (Fixed Size) -->
    <div id="promo-popup" class="popup-overlay">
        <div class="popup-content">
            <span class="close-btn" onclick="closePopup()">&times;</span>
            <img id="promo-img-display" src="" alt="Promotion" style="display: none;">
            <h3 id="promo-title-text" style="color: #3B163A; margin-bottom: 8px;"></h3>
            <p id="promo-desc-text" style="color: #636e72; font-size: 13px; margin-bottom: 15px;"></p>
            <button onclick="closePopup()" style="background:#3B163A; color:#F0C986; border:none; padding:10px 20px; border-radius:6px; font-weight:bold; cursor:pointer;">Explore Now</button>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 Custom Zone. All Rights Reserved.</p>
        <p>Located at Liluah Chakpara, Howrah | <a href="contact.html">Contact Us</a></p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
