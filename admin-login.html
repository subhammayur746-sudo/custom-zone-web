<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin & Staff Login - Custom Zone</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="js/firebase-config.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); 
            padding: 20px; 
        }
        .login-card { 
            background: #ffffff; 
            width: 100%; 
            max-width: 420px; 
            padding: 35px 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            text-align: center; 
            position: relative;
        }
        .login-logo { 
            width: 65px; 
            height: 65px; 
            border-radius: 50%; 
            margin-bottom: 12px; 
            object-fit: contain; 
        }
        .login-card h2 { 
            color: #0f172a; 
            font-size: 22px; 
            font-weight: 800; 
            margin-bottom: 4px; 
        }
        .login-card p { 
            color: #64748b; 
            font-size: 12.5px; 
            margin-bottom: 24px; 
        }
        .form-group { 
            margin-bottom: 18px; 
            text-align: left; 
        }
        .form-group label { 
            display: block; 
            font-size: 12px; 
            font-weight: 700; 
            color: #334155; 
            margin-bottom: 6px; 
        }
        .input-wrap { 
            position: relative; 
            display: flex; 
            align-items: center; 
        }
        .input-wrap i.prefix-icon { 
            position: absolute; 
            left: 12px; 
            color: #94a3b8; 
            font-size: 14px; 
        }
        .input-wrap input { 
            width: 100%; 
            padding: 11px 40px 11px 36px; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            font-size: 13.5px; 
            color: #0f172a; 
            background: #f8fafc; 
            transition: 0.2s; 
        }
        .input-wrap input:focus { 
            outline: none; 
            border-color: #2563eb; 
            background: #ffffff; 
            box-shadow: 0 0 0 2px rgba(37,99,235,0.1); 
        }
        .toggle-password-btn { 
            position: absolute; 
            right: 12px; 
            background: none; 
            border: none; 
            color: #64748b; 
            cursor: pointer; 
            font-size: 15px; 
            padding: 4px; 
        }
        .toggle-password-btn:hover { 
            color: #0f172a; 
        }
        .btn-login { 
            width: 100%; 
            padding: 12px; 
            background: #2563eb; 
            color: #ffffff; 
            border: none; 
            border-radius: 6px; 
            font-size: 14px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: 0.2s; 
            margin-top: 8px; 
        }
        .btn-login:hover { 
            background: #1d4ed8; 
        }
        .btn-login:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        #login-error-msg { 
            color: #ef4444; 
            font-size: 12px; 
            margin-top: 14px; 
            font-weight: 600; 
            display: none; 
        }
        .lockout-banner {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #f87171;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 16px;
            display: none;
        }

        /* Master Security PIN Modal */
        .pin-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.8);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .pin-modal-card {
            background: #fff;
            width: 100%;
            max-width: 380px;
            padding: 30px 24px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25);
        }
        .pin-input-field {
            width: 100%;
            padding: 12px;
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 12px;
            border: 2px solid #2563eb;
            border-radius: 8px;
            margin: 18px 0;
            background: #f8fafc;
        }
        .pin-input-field:focus {
            outline: none;
            border-color: #1d4ed8;
            background: #fff;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="assets/images/logo.png" onerror="this.src='assets/images/logo2.png'" class="login-logo" alt="Custom Zone">
        <h2>CZ Management Portal</h2>
        <p>Admin & Staff Authorized Access</p>

        <!-- Brute-force Lockout Notice -->
        <div class="lockout-banner" id="lockout-notice">
            <i class="fas fa-lock"></i> Account temporarily locked!<br>
            Try again in: <span id="lockout-timer">15:00</span>
        </div>

        <form id="admin-login-form" onsubmit="handlePortalLogin(event)">
            <div class="form-group">
                <label>Username / Login Phone *</label>
                <div class="input-wrap">
                    <i class="fas fa-user prefix-icon"></i>
                    <input type="text" id="portal-username" placeholder="Enter username or phone" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label>Password *</label>
                <div class="input-wrap">
                    <i class="fas fa-lock prefix-icon"></i>
                    <input type="password" id="portal-password" placeholder="Enter password" required autocomplete="current-password">
                    <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('portal-password', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btn-login-submit">
                <i class="fas fa-sign-in-alt"></i> Login to Portal
            </button>
        </form>

        <p id="login-error-msg"></p>
    </div>

    <!-- 2-Step Master Security PIN Modal (Strict Admin Only) -->
    <div class="pin-modal-overlay" id="admin-pin-modal">
        <div class="pin-modal-card">
            <div style="width:52px; height:52px; background:#eff6ff; color:#2563eb; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 12px auto; font-size:24px;">
                <i class="fas fa-key"></i>
            </div>
            <h3 style="color:#0f172a; margin-bottom:4px; font-size:18px; font-weight:800;">Master Security PIN</h3>
            <p style="color:#64748b; font-size:12px; margin:0; line-height:1.4;">
                Enter your secret 4-digit Master Security PIN to complete login:
            </p>

            <input type="password" id="admin-entered-pin" class="pin-input-field" maxlength="4" placeholder="••••" autocomplete="off">

            <div id="pin-error-msg" style="color:#ef4444; font-size:12px; font-weight:600; display:none; margin-bottom:12px;"></div>

            <button onclick="verifyAdminPIN()" id="btn-verify-pin" style="width:100%; padding:12px; background:#2563eb; color:#fff; border:none; border-radius:6px; font-weight:700; font-size:14px; cursor:pointer;">
                Authorize & Access
            </button>
            <button onclick="cancelAdminPIN()" style="width:100%; margin-top:8px; padding:8px; background:none; border:none; color:#64748b; font-size:12px; cursor:pointer;">
                Cancel
            </button>
        </div>
    </div>

    <script>
        // MASTER PIN CONFIGURATION (Secret 4-Digit PIN)
        const MASTER_SECURITY_PIN = "7730";

        // Lockout Settings
        const MAX_FAILED_ATTEMPTS = 5;
        const LOCKOUT_DURATION_MS = 15 * 60 * 1000; // 15 Minutes
        let lockoutInterval = null;

        let pendingMasterAdminSession = null;

        window.onload = () => {
            checkExistingLockout();
        };

        function togglePasswordVisibility(inputId, btnEl) {
            const input = document.getElementById(inputId);
            const icon = btnEl.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // 1. RATE LIMITING / LOCKOUT LOGIC
        function checkExistingLockout() {
            const lockoutUntil = parseInt(localStorage.getItem('cz_login_lockout_until')) || 0;
            const now = Date.now();

            if (lockoutUntil > now) {
                applyLockoutUI(lockoutUntil);
            } else {
                localStorage.removeItem('cz_login_lockout_until');
                removeLockoutUI();
            }
        }

        function registerFailedAttempt() {
            let attempts = parseInt(localStorage.getItem('cz_login_failed_attempts')) || 0;
            attempts++;
            localStorage.setItem('cz_login_failed_attempts', attempts);

            const remaining = MAX_FAILED_ATTEMPTS - attempts;

            if (attempts >= MAX_FAILED_ATTEMPTS) {
                const lockoutUntil = Date.now() + LOCKOUT_DURATION_MS;
                localStorage.setItem('cz_login_lockout_until', lockoutUntil);
                localStorage.removeItem('cz_login_failed_attempts');
                applyLockoutUI(lockoutUntil);
            } else {
                const errorMsg = document.getElementById('login-error-msg');
                errorMsg.innerText = `❌ Invalid credentials! ${remaining} attempt(s) left before account lockout.`;
                errorMsg.style.display = "block";
            }
        }

        function applyLockoutUI(lockoutUntil) {
            const banner = document.getElementById('lockout-notice');
            const timerEl = document.getElementById('lockout-timer');
            const submitBtn = document.getElementById('btn-login-submit');
            const errorMsg = document.getElementById('login-error-msg');

            banner.style.display = "block";
            submitBtn.disabled = true;
            errorMsg.style.display = "none";

            if (lockoutInterval) clearInterval(lockoutInterval);

            lockoutInterval = setInterval(() => {
                const timeLeft = lockoutUntil - Date.now();
                if (timeLeft <= 0) {
                    clearInterval(lockoutInterval);
                    removeLockoutUI();
                    localStorage.removeItem('cz_login_lockout_until');
                    localStorage.removeItem('cz_login_failed_attempts');
                } else {
                    const minutes = Math.floor(timeLeft / (60 * 1000));
                    const seconds = Math.floor((timeLeft % (60 * 1000)) / 1000);
                    timerEl.innerText = `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                }
            }, 1000);
        }

        function removeLockoutUI() {
            document.getElementById('lockout-notice').style.display = "none";
            document.getElementById('btn-login-submit').disabled = false;
        }

        // 2. PORTAL AUTHENTICATION
        async function handlePortalLogin(e) {
            e.preventDefault();
            checkExistingLockout();

            if (parseInt(localStorage.getItem('cz_login_lockout_until')) > Date.now()) {
                return;
            }

            const usernameInput = document.getElementById('portal-username').value.trim();
            const passwordInput = document.getElementById('portal-password').value.trim();
            const errorMsg = document.getElementById('login-error-msg');
            const btn = document.getElementById('btn-login-submit');

            errorMsg.style.display = "none";
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Authenticating...`;

            try {
                // Admin check with permanent password: admin@2005
                if (usernameInput.toLowerCase() === "admin" && passwordInput === "admin@2005") {
                    
                    pendingMasterAdminSession = {
                        name: "Master Admin",
                        username: "admin",
                        role: "main_admin",
                        canDelete: true,
                        permissions: ['products', 'orders', 'customers', 'invoice', 'reviews', 'coupons']
                    };

                    // Prompt for Secret Master PIN
                    document.getElementById('admin-pin-modal').style.display = 'flex';
                    document.getElementById('admin-entered-pin').value = "";
                    document.getElementById('pin-error-msg').style.display = "none";
                    document.getElementById('admin-entered-pin').focus();
                    return;
                }

                // Staff check in Cloud Firestore
                const staffQuerySnap = await db.collection("staff").get();
                let matchedStaff = null;

                staffQuerySnap.forEach(doc => {
                    const s = doc.data();
                    const cleanDbUser = (s.username || "").trim().toLowerCase();
                    const cleanInputUser = usernameInput.toLowerCase();

                    if ((cleanDbUser === cleanInputUser || s.phone === usernameInput) && (s.password || "").trim() === passwordInput) {
                        matchedStaff = s;
                        matchedStaff.docId = doc.id;
                    }
                });

                if (matchedStaff) {
                    if (matchedStaff.isActive === false) {
                        errorMsg.innerText = "❌ This staff account has been deactivated by Admin.";
                        errorMsg.style.display = "block";
                        btn.disabled = false;
                        btn.innerHTML = `<i class="fas fa-sign-in-alt"></i> Login to Portal`;
                        return;
                    }

                    // Reset failed counter
                    localStorage.removeItem('cz_login_failed_attempts');

                    const staffSession = {
                        name: matchedStaff.name || matchedStaff.username,
                        username: matchedStaff.username,
                        role: matchedStaff.role || "staff",
                        canDelete: false,
                        permissions: Array.isArray(matchedStaff.permissions) ? matchedStaff.permissions : []
                    };

                    localStorage.setItem('cz_logged_in_user', JSON.stringify(staffSession));
                    
                    try {
                        await db.collection("audit_logs").add({
                            actor: staffSession.name,
                            role: staffSession.role,
                            action: "Staff Logged into Admin Portal",
                            targetId: staffSession.username,
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    } catch(err) {}

                    window.location.href = "admin-dashboard.html";
                    return;
                }

                registerFailedAttempt();

            } catch (err) {
                console.error("Login verification error:", err);
                errorMsg.innerText = "⚠️ Network or authentication error. Please try again.";
                errorMsg.style.display = "block";
            } finally {
                if (!parseInt(localStorage.getItem('cz_login_lockout_until'))) {
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fas fa-sign-in-alt"></i> Login to Portal`;
                }
            }
        }

        // 3. MASTER PIN VERIFICATION (SUPER ADMIN)
        async function verifyAdminPIN() {
            const enteredPIN = document.getElementById('admin-entered-pin').value.trim();
            const pinErr = document.getElementById('pin-error-msg');
            const verifyBtn = document.getElementById('btn-verify-pin');

            if (enteredPIN === MASTER_SECURITY_PIN) {
                verifyBtn.innerText = "Access Granted...";
                verifyBtn.disabled = true;

                localStorage.removeItem('cz_login_failed_attempts');
                localStorage.removeItem('cz_login_lockout_until');

                localStorage.setItem('cz_logged_in_user', JSON.stringify(pendingMasterAdminSession));

                try {
                    await db.collection("audit_logs").add({
                        actor: "Master Admin",
                        role: "main_admin",
                        action: "Admin Authenticated via Master Security PIN",
                        targetId: "Portal Security",
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch(e) {}

                window.location.href = "admin-dashboard.html";
            } else {
                pinErr.innerText = "❌ Incorrect Master Security PIN!";
                pinErr.style.display = "block";
                registerFailedAttempt();
            }
        }

        function cancelAdminPIN() {
            document.getElementById('admin-pin-modal').style.display = 'none';
            pendingMasterAdminSession = null;
            const btn = document.getElementById('btn-login-submit');
            btn.disabled = false;
            btn.innerHTML = `<i class="fas fa-sign-in-alt"></i> Login to Portal`;
        }

        // Allow Enter key to trigger PIN verification
        document.getElementById('admin-entered-pin').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') verifyAdminPIN();
        });
    </script>
</body>
</html>
