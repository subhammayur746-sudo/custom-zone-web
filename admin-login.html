<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Custom Zone</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="js/firebase-config.js"></script>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle at center, #4e1e4c, #3B163A);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .login-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 6px solid #F0C986;
        }
        .login-card img {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #F0C986;
            margin-bottom: 12px;
        }
        .login-card h2 {
            margin: 0 0 6px 0;
            color: #3B163A;
            font-size: 24px;
            font-weight: 800;
        }
        .login-card p {
            color: #636e72;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #3B163A;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus {
            border-color: #F0C986;
            box-shadow: 0 0 8px rgba(240, 201, 134, 0.4);
        }
        .btn-login {
            background: #3B163A;
            color: #F0C986;
            border: none;
            padding: 13px;
            width: 100%;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-login:hover {
            background: #260c25;
            color: #ffffff;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="assets/images/logo.png" alt="Custom Zone Logo">
        <h2>Admin Access</h2>
        <p>Enter your credentials to manage Custom Zone</p>

        <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label>Admin Username / Email</label>
                <input type="text" id="login-email" placeholder="admin" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="••••••••" required autocomplete="off">
            </div>
            <button type="submit" class="btn-login" id="btn-login-submit">Login to Dashboard</button>
            <p id="login-error-msg" style="color:#e74c3c; font-size:13px; margin-top:12px; font-weight:bold; display:none;"></p>
        </form>
    </div>

    <script>
        localStorage.removeItem('cz_logged_in_user');

        async function handleAdminLogin(e) {
            e.preventDefault();
            const emailInput = document.getElementById('login-email').value.trim();
            const passwordInput = document.getElementById('login-password').value.trim();
            const errorMsg = document.getElementById('login-error-msg');
            const submitBtn = document.getElementById('btn-login-submit');

            errorMsg.style.display = "none";
            submitBtn.disabled = true;
            submitBtn.innerText = "Verifying...";

            if ((emailInput.toLowerCase() === "admin" || emailInput.toLowerCase() === "admin@customzone.com") && passwordInput === "admin@2005") {
                const sessionUser = {
                    name: "Master Admin",
                    username: "admin",
                    role: "Master Admin",
                    permissions: ["all"]
                };
                localStorage.setItem('cz_logged_in_user', JSON.stringify(sessionUser));
                window.location.href = "admin-dashboard.html";
                return;
            }

            try {
                const userDoc = await db.collection("staff").doc(emailInput.toLowerCase()).get();
                if (userDoc.exists && userDoc.data().password === passwordInput) {
                    const userData = userDoc.data();
                    localStorage.setItem('cz_logged_in_user', JSON.stringify({
                        name: userData.name || emailInput,
                        username: emailInput,
                        role: userData.role || "Staff",
                        permissions: userData.permissions || []
                    }));
                    window.location.href = "admin-dashboard.html";
                } else {
                    errorMsg.style.display = "block";
                    errorMsg.innerText = "❌ Invalid username or password.";
                }
            } catch (err) {
                console.error(err);
                errorMsg.style.display = "block";
                errorMsg.innerText = "❌ Invalid username or password.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Login to Dashboard";
            }
        }
    </script>
</body>
</html>
