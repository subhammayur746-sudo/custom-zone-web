<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Zone - Cart</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Firebase CDN Links -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <!-- Custom Firebase Config -->
    <script src="js/firebase-config.js"></script>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo-container">
            <a href="index.html">
                <img src="assets/images/logo.png" alt="Custom Zone Logo" class="logo-img">
            </a>
            <h1 class="brand-name">Custom Zone</h1>
        </div>
        
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
            <a href="track-order.html">Track Order</a>
        </nav>

        <div class="cart-icon">
            <a href="cart.html" class="active">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-count">0</span>
            </a>
        </div>
    </header>

    <!-- Cart Container -->
    <main class="container">
        <h2 class="section-title">Your Shopping Cart</h2>
        
        <div class="cart-layout">
            <!-- Cart Items List -->
            <div class="cart-items" id="cart-items-container">
                <!-- Products loaded via JS -->
            </div>

            <!-- Checkout Box -->
            <div class="checkout-box">
                <!-- Order Summary Display -->
                <div style="background: #fff; padding: 15px 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px;">
                    <h3 style="color: #2c3e50; margin-bottom: 10px;"><i class="fas fa-receipt"></i> Order Summary</h3>
                    <p style="margin: 5px 0; color: #555;">Total Items: <strong id="total-items">0</strong></p>
                    <p style="margin: 5px 0; color: #555;">Payable Total: <strong style="color: #e74c3c; font-size: 18px;">₹<span id="total-price">0</span></strong></p>
                </div>

                <!-- Customer Details Form -->
                <div class="checkout-form" style="background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px;">
                    <h3 style="margin-bottom: 15px; color: #2c3e50;"><i class="fas fa-user-edit"></i> Customer Details</h3>
                    
                    <div style="margin-bottom: 15px;">
                        <input type="text" id="cust-name" placeholder="Full Name *" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" required>
                    </div>
                    
                    <div style="display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap;">
                        <input type="tel" id="cust-phone" placeholder="Phone Number *" style="flex: 1; min-width: 200px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" required>
                        <input type="email" id="cust-email" placeholder="Email Address (Optional)" style="flex: 1; min-width: 200px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
                    </div>
                    
                    <div style="margin-bottom: 15px;">
                        <textarea id="cust-address" placeholder="Full Address (e.g., Liluah Chakpara) *" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; height: 80px;" required></textarea>
                    </div>
                    
                    <div style="display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap;">
                        <input type="text" id="cust-district" placeholder="District (e.g., Howrah) *" style="flex: 1; min-width: 150px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" required>
                        <input type="number" id="cust-pin" placeholder="PIN Code *" style="flex: 1; min-width: 150px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" required>
                    </div>
                </div>

                <button class="checkout-btn" onclick="generateInvoiceAndQR()">Generate Invoice & Pay</button>

                <!-- Payment Section (Hidden initially) -->
                <div id="payment-section" style="display: none; margin-top: 20px; text-align: center;">
                    <div class="invoice-box">
                        <p>Order ID: <strong id="order-id-display"></strong></p>
                    </div>
                    <p style="margin-bottom: 10px; font-size: 14px;">Scan below QR to pay exact amount</p>
                    <div id="qrcode-display" style="display: flex; justify-content: center; margin-bottom: 15px;"></div>
                    
                    <button class="whatsapp-btn" onclick="sendToWhatsApp()">
                        <i class="fab fa-whatsapp"></i> Send Screenshot to WhatsApp
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Custom Zone. All Rights Reserved.</p>
        <p>Located at Liluah Chakpara, Howrah | <a href="contact.html">Contact Us</a></p>
    </footer>

    <script src="js/cart.js"></script>
</body>
</html>
